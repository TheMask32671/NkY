name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Gerar o APK do Ariane Controle
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o codigo
        uses: actions/checkout@v4

      - name: Preparar o Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar o Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK em: $SDK" | tee -a build-log.txt
          echo "sdk.dir=$SDK" > local.properties
          ls "$SDK/platforms" 2>/dev/null | tee -a build-log.txt || true
          ls "$SDK/build-tools" 2>/dev/null | tee -a build-log.txt || true
          SDKMGR=$(ls "$SDK"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMGR" ]; then
            yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true
            if [ ! -d "$SDK/platforms/android-35" ]; then
              "$SDKMGR" "platforms;android-35" "build-tools;35.0.0" 2>&1 | tail -5 | tee -a build-log.txt || true
            fi
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"

      - name: Testar os calculos
        id: testes
        continue-on-error: true
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew testDebugUnitTest --no-daemon --stacktrace 2>&1 | tee -a build-log.txt

      - name: Compilar o APK
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 | tee -a build-log.txt

      - name: Publicar o log da compilacao
        if: always()
        run: |
          rm -rf /tmp/logs
          mkdir -p /tmp/logs
          cd /tmp/logs
          cp "$GITHUB_WORKSPACE/build-log.txt" . 2>/dev/null || echo "sem log" > build-log.txt
          echo "run=${{ github.run_number }} testes=${{ steps.testes.outcome }} build=${{ steps.build.outcome }}" > status.txt
          git init -q
          git checkout -q -b ci-logs
          git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "log da compilacao ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs

      - name: Parar se algo falhou
        if: steps.testes.outcome == 'failure' || steps.build.outcome == 'failure'
        run: exit 1

      - name: Preparar o arquivo do APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ariane-controle.apk

      - name: Guardar o APK no Actions
        uses: actions/upload-artifact@v4
        with:
          name: ariane-controle-apk
          path: ariane-controle.apk

      - name: Publicar o APK em Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" ariane-controle.apk \
            --title "Ariane: Controle v1.0.${{ github.run_number }}" \
            --notes "APK pronto para instalar no Android. Baixe o arquivo ariane-controle.apk, abra no celular e confirme a instalacao."
